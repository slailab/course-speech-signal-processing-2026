# Tutorial settings. Relative paths are resolved against this folder.
# Data lives in ../data, shared by all tutorials. The input is the output manifest of
# the preprocess tutorial (audio, textgrid per utterance); the linguistic features
# are written next to it and recorded in it.
paths:
  manifest: ../data/preprocess/example_dataset_16k/manifest.jsonl   # preprocess output
  third_party: third_party                                           # fetched by setup.sh

linguistic:
  dir: linguistic   # output folder, relative to the manifest's folder
